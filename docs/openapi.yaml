openapi: 3.1.0
info:
  title: Career Quest API
  version: 0.1.0
  description: |
    Контракт для интеграции фронт (Codex) ↔ бек (Antigravity) ↔ AI-ядро (GLM).
    Единый источник правды. Меняет только GLM.
servers:
  - url: http://localhost:8000
    description: local (docker compose up)

paths:
  /health:
    get:
      summary: Проверка живости
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /employees:
    get:
      summary: Список сотрудников (для входа/выбора и HR)
      responses:
        "200":
          description: Список
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EmployeeSummary" }

  /employees/{employee_id}:
    get:
      summary: Профиль сотрудника с траекторией
      parameters:
        - name: employee_id
          in: path
          required: true
          schema: { type: string, example: E0028 }
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeProfile" }
        "404":
          description: Не найден

  /recommendations/{employee_id}:
    post:
      summary: AI-рекомендация 1–3 шагов с обоснованием (≥3 фактора)
      description: Дедлайн 10 сек. Язык обоснования — preferred_language профиля.
      parameters:
        - name: employee_id
          in: path
          required: true
          schema: { type: string, example: E0028 }
      responses:
        "200":
          description: Рекомендации
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendationResponse" }
        "404":
          description: Не найден
        "504":
          description: AI-таймаут (вернуть хотя бы скоринг без LLM-текста)

  /employees/{employee_id}/complete/{event_id}:
    post:
      summary: Отметить активность выполненной
      description: Применяет gain до max_level, пересчитывает траекторию, пишет в activity_history.
      parameters:
        - name: employee_id
          in: path
          required: true
          schema: { type: string }
        - name: event_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Результат применения
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompletionResult" }

  /admin/load-dataset:
    post:
      summary: Загрузка проверочных профилей жюри (формат датасета)
      description: |
        КРИТИЧНО для защиты. Принимает employees.json (или events/skills) и/или
        activity_history.csv в формате стартового кита. Слияние/замена в store.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                employees: { type: string, format: binary, description: JSON-файл employees }
                events: { type: string, format: binary }
                skills: { type: string, format: binary }
                activity_history: { type: string, format: binary, description: CSV }
          application/json:
            schema:
              type: object
              properties:
                employees:
                  type: object
                  description: содержимое employees.json
                activity_history:
                  type: array
                  description: строки CSV в виде объектов
                  items: { type: object }
      responses:
        "200":
          description: Итог загрузки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoadDatasetResult" }
        "422":
          description: Ошибки валидации (список по строкам)

  /hr/dashboard:
    get:
      summary: HR-срез (только роль HR)
      parameters:
        - name: X-Role
          in: header
          required: true
          schema: { type: string, enum: [employee, hr], default: hr }
      responses:
        "200":
          description: Дашборд
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HRDashboard" }
        "403":
          description: Не HR

components:
  schemas:
    EmployeeSummary:
      type: object
      properties:
        employee_id: { type: string, example: E0028 }
        full_name: { type: string, example: Aisultan Nurlybek }
        department: { type: string }
        role: { type: string, example: Backend Engineer }
        grade: { type: string, example: Middle }
        tenure_months: { type: integer }
        preferred_language: { type: string, enum: [kk, ru, en] }
        career_goal:
          type: [object, "null"]
          properties:
            target_role: { type: string }
            target_grade: { type: string }

    EmployeeProfile:
      type: object
      properties:
        employee: { $ref: "#/components/schemas/EmployeeSummary" }
        next_grade:
          type: object
          description: "Цель: career_goal или grade+1"
          properties:
            role: { type: string }
            grade: { type: string }
            requirements_met: { type: boolean }
        skills:
          type: array
          items: { $ref: "#/components/schemas/SkillLevel" }
        history:
          type: array
          items: { $ref: "#/components/schemas/ActivityRecord" }
        available_steps:
          type: array
          items: { $ref: "#/components/schemas/EventSummary" }

    SkillLevel:
      type: object
      properties:
        skill_id: { type: string, example: SK_SYSTEM_DESIGN }
        name: { type: string }
        type: { type: string, enum: [hard, soft] }
        current: { type: integer, minimum: 0, maximum: 5 }
        required: { type: integer, minimum: 0, maximum: 5, description: Требование next grade }
        gap: { type: integer, description: max(0, required - current) }
        critical: { type: boolean, description: critical_skill следующего грейда }

    ActivityRecord:
      type: object
      properties:
        record_id: { type: string }
        event_id: { type: string }
        title: { type: string }
        date: { type: string, format: date }
        due_date: { type: [string, "null"], format: date }
        status: { type: string, enum: [completed, in_progress, dropped, no_show, declined, overdue] }
        completion_pct: { type: integer }
        score: { type: [integer, "null"] }
        feedback_rating: { type: [integer, "null"] }
        assigned_by: { type: string, enum: [self, manager, hr] }

    EventSummary:
      type: object
      properties:
        event_id: { type: string, example: EV_012 }
        title: { type: string }
        type: { type: string, enum: [compliance, onboarding, course, workshop, mentoring, certification, meetup] }
        format: { type: string, enum: [online, offline, self_paced] }
        duration_hours: { type: number }
        mandatory: { type: boolean }
        develops_skills:
          type: array
          items:
            type: object
            properties:
              skill_id: { type: string }
              gain: { type: integer }
              max_level: { type: integer }
        prerequisites:
          type: object
          additionalProperties: { type: integer }
        upcoming_sessions:
          type: array
          items: { type: string, format: date }

    Factor:
      type: object
      description: Один фактор обоснования. Минимум 3 разных type в каждой рекомендации.
      properties:
        type:
          type: string
          enum: [skill_gap, critical_skill, history_pattern, prerequisites_met, grade_fit, session_availability]
        skill_id: { type: [string, "null"] }
        message: { type: string, example: "System Design 2/4 — разрыв закрывается активностью" }
        weight: { type: number, description: Вклад фактора в скоринг, 0–1 }

    Recommendation:
      type: object
      properties:
        rank: { type: integer, minimum: 1, maximum: 3 }
        event: { $ref: "#/components/schemas/EventSummary" }
        score: { type: number }
        factors:
          type: array
          minItems: 3
          items: { $ref: "#/components/schemas/Factor" }
        explanation:
          type: object
          properties:
            language: { type: string, enum: [kk, ru, en] }
            text:
              type: string
              example: "System Design — 2 при требуемых 4 для Senior; активность закрывает разрыв, предыдущие две пройдены в срок"
            factors_used: { type: array, items: { type: string } }

    RecommendationResponse:
      type: object
      properties:
        employee_id: { type: string }
        generated_at: { type: string, format: date-time }
        engine: { type: string, enum: [openai, nvidia, heuristic-fallback], description: Какой LLM-бэкенд сработал }
        recommendations:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/Recommendation" }

    CompletionResult:
      type: object
      properties:
        employee_id: { type: string }
        event_id: { type: string }
        skills_updated:
          type: array
          items:
            type: object
            properties:
              skill_id: { type: string }
              before: { type: integer }
              after: { type: integer }
              capped_by_max_level: { type: boolean }
        trajectory_updated: { type: boolean }
        requirements_met: { type: boolean, description: Все ли требования next grade теперь выполнены }

    LoadDatasetResult:
      type: object
      properties:
        status: { type: string, example: ok }
        employees_loaded: { type: integer }
        events_loaded: { type: integer }
        skills_loaded: { type: integer }
        history_records_loaded: { type: integer }
        errors:
          type: array
          items: { type: string }

    HRDashboard:
      type: object
      properties:
        weak_skills:
          type: array
          description: Навыки, чаще всего проседающие (по разрывам к next grade)
          items:
            type: object
            properties:
              skill_id: { type: string }
              name: { type: string }
              avg_gap: { type: number }
              affected_employees: { type: integer }
              departments:
                type: array
                items:
                  type: object
                  properties:
                    department: { type: string }
                    avg_gap: { type: number }
        employees_without_recommendation:
          type: array
          items:
            type: object
            properties:
              employee_id: { type: string }
              full_name: { type: string }
              reason: { type: string }
        activity_engagement:
          type: array
          items:
            type: object
            properties:
              event_id: { type: string }
              title: { type: string }
              participants: { type: integer }
              completion_rate: { type: number }
              drop_rate: { type: number }
